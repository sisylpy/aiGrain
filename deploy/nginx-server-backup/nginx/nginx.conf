user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;


        server {
        listen 443 ssl;
 
        server_name grainservice.club; 
         ssl_certificate /etc/nginx/grainservice.club_bundle.crt; 
         ssl_certificate_key /etc/nginx/grainservice.club.key; 
         ssl_session_timeout 5m;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2; 
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE; 
        ssl_prefer_server_ciphers on;
        # 上传头像/商品图等 multipart，需大于默认 1m，否则 413（与 Spring multipart 上限对齐）
        client_max_body_size 100m;
      #  location /txs/{
   
       #      root /usr/share/nginx/html/ls/txs;
        #    alias /usr/share/nginx/html/txs/; 
         #   index  index.html index.htm;
	#	try_files $uri $uri/ =404;
       # }


location /ibook/ {
    alias /usr/share/nginx/html/ibook/;
    index index.html;
    try_files $uri $uri/ /ibook/index.html;
}

	# 静态图片（与 spring app.files.images-root 下 images 目录一致；root 按服务器实际改）
	location /goodsVideo/ {
	    root /opt/tomcat/latest/app-data/images;
	    access_log off;
	    expires 7d;
	}
	location /goodsImage/ {
	    root /opt/tomcat/latest/app-data/images;
	    access_log off;
	    expires 7d;
	}
	location /uploadImage/ {
	    root /opt/tomcat/latest/app-data/images;
	    access_log off;
	    expires 7d;
	}
	location /foodImage/ {
	    root /opt/tomcat/latest/app-data/images;
	    access_log off;
	    expires 7d;
	}
	location /userImage/ {
	    root /opt/tomcat/latest/app-data/images;
	    access_log off;
	    expires 7d;
	}
	location /uploadClock/ {
	    root /opt/tomcat/latest/app-data/images;
	    access_log off;
	    expires 7d;
	}
	location /stockImages/ {
	    root /opt/tomcat/latest/app-data/images;
	    access_log off;
	    expires 7d;
	}
	location /traceReports/ {
	    root /opt/tomcat/latest/app-data/images;
	    access_log off;
	    expires 7d;
	}
	location /ocrImages/ {
	    root /opt/tomcat/latest/app-data/images;
	    access_log off;
	    expires 7d;
	}

	location / {
	         root  /usr/share/nginx/html/lc;
		index index.html index.htm;
		try_files $uri $uri/ /index.html;

	}
   
          # 反向代理到aigrain项目的API
        location /api/ {
            proxy_pass http://localhost:8090/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }










    }




   

