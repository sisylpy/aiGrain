# =============================================================================
# 静态图片 location — 粘贴到 grainservice.club 的 server { } 内，
# 放在 SPA try_files / index.html 之前，避免 /goodsImage 被当成页面返回 HTML。
#
# 将每段里的 root 路径改成你服务器上「images」上一层父路径（与 app.files.images-root 去掉 file: 后一致）
# 例：root /opt/tomcat/latest/app-data/images;  → 文件 goodsImage/xx 在 .../images/goodsImage/xx
# Java 子目录与 URL 前缀见 com.nongxinle.utils.ImagePaths；改 location 须同步改代码，避免写盘与访问分叉。
#
# 中文文件名：浏览器里 %E6… 是正常编码。若 404/裂图，多为「双重编码」或磁盘名与 UTF-8 不一致，
# 见同目录 GET-image-urls.txt 文末排查。可选在 server 内加：charset utf-8;
# =============================================================================

location /goodsVideo/ {
    root /opt/tomcat/latest/app-data/images;
    access_log off;
    expires 7d;
}
location /goodsImage/ {
    root /opt/tomcat/latest/app-data/images;
    access_log off;
    expires 7d;
}
