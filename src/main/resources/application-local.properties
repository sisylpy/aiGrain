# 本机快速联调：不依赖 MySQL 写 Trace，避免 Mapper 建连超时阻塞 SSE。
# 本机不写 /opt/tomcat，上传根目录在用户目录（UploadFile 首次会 mkdir）
app.files.images-root=file:${user.home}/aigrain-desk-uploads/images/
# 默认已启用 local profile（见 application.yml）；也可显式指定：
# mvn spring-boot:run "-Dspring-boot.run.arguments=--spring.profiles.active=local"
# 可选改端口：同一 arguments 里加空格分隔的 --server.port=8091（勿用逗号拼接 profile 与 port）
# 需要 Trace 入账时在同一 arguments 中加：--ai.trace.persist-enabled=true（须已执行 sql/gb_ai_agent_run_step.sql 并可连库）
ai.trace.persist-enabled=true

# Harness：replay / 调试 GET run 摘要
ai.harness.debug-context-enabled=true
# 本地可跑 POST /api/ai/harness/replay（生产务必 false）
ai.harness.replay-enabled=true

# 本地 MySQL 数据源（覆盖 application.yml 的生产默认值）
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ai_marketing?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=Lpy87176693
