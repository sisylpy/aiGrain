# =============================================================================
# 本地/默认：图片根目录在「工作目录下的 images/」，与仓库内 images 目录一致，发版不随 jar 覆盖。
# 生产：请改为 Tomcat 外挂盘（与旧项目一致），例如：
#   app.files.images-root=file:/opt/tomcat/latest/app-data/images/
# 与老项目同服务器时，可直接填与老项目相同的根路径，共用同一套图片目录。
#
# 浏览器里图片「完整地址」若需固定走老站点（8443 + /nongxinle），在前端环境变量配置，例如：
#   VITE_PUBLIC_IMAGE_BASE=https://grainservice.club:8443/nongxinle
# 展示：base + '/' + 库里的相对路径（如 goodsImage/xxx.jpg），不要写死 443 根路径。
# 也可用环境变量（Spring Boot 松散绑定）：APP_FILES_IMAGES_ROOT=file:/opt/...
# 注意：须以 / 结尾；建议带 file: 前缀，便于 Spring 解析为本地目录。
# =============================================================================
app.files.images-root=file:${user.dir}/images/
