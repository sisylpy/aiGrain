# 图片读写与 Spring 静态资源、nginx root 统一为同一「images」目录（子目录名见 ImagePaths）。
# 可用环境变量 APP_FILES_IMAGES_ROOT 覆盖。
app.files.images-root=file:/opt/tomcat/latest/app-data/images/

# 与前端 `docs/API_INTEGRATION.md` 及网关约定一致：完整 REST 前缀为 `/api/**`。
# 若线上由外层网关剥离前缀，可在此环境下覆盖为空或改为其它值。
server.servlet.context-path=/api

# SSE/JSON 中文
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# AI Harness（第二阶段）：默认关闭。开启后 GET /api/ai/runs/{runId} 附带 resolvedQueryContextSummary。
ai.harness.debug-context-enabled=true

# Replay 接口 POST /api/ai/harness/replay；仅建议在 local / 内网开启。
ai.harness.replay-enabled=true

# Harness 语义：LLM 仅解析意图/口述范围文案；SQL 部门门店 ID 仍由服务端 Resolver 推导。
ai.agent.querySemanticLlm.minConfidence=0.55

# C-63：Composite SHADOW 旁路灰度（默认全开「关」— shadow.enabled=false 时不跑旁路 Composite，仅 legacy）
# 须同时满足 productionEnabled=true、executionMode=SHADOW、Gate allowed；Harness GRAPH_RUN 不经此闸。
ai.composite.businessDiagnosis.shadow.enabled=false
ai.composite.businessDiagnosis.shadow.userWhitelist=
ai.composite.businessDiagnosis.shadow.distributerWhitelist=
ai.composite.businessDiagnosis.shadow.departmentWhitelist=
ai.composite.businessDiagnosis.shadow.scopeWhitelist=
ai.composite.businessDiagnosis.shadow.maxRunsPerMinute=0
ai.composite.businessDiagnosis.shadow.maxRunsPerHour=0
ai.composite.businessDiagnosis.shadow.cooldownSeconds=0